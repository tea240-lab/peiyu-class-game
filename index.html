<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>珮瑜的萬用課堂闖關</title><style>body{font-family:system-ui,"Microsoft JhengHei";margin:0;background:linear-gradient(135deg,#f6f8ff,#fff7ef);color:#172033}main{max-width:1100px;margin:auto;padding:30px}h1{text-align:center;font-size:42px}.teacher{display:block;margin:20px auto;padding:18px 28px;border-radius:18px;background:#172033;color:white;text-decoration:none;text-align:center;font-size:25px;font-weight:900;max-width:360px}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card{background:white;border-radius:24px;padding:18px;text-align:center;box-shadow:0 10px 30px #0002}.animal{font-size:50px}.name{font-size:22px;font-weight:900}.qr{margin:12px auto}.go{display:block;padding:12px;border-radius:14px;background:#dff3ff;text-decoration:none;color:#172033;font-weight:900}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><h1>👑 珮瑜的萬用課堂闖關</h1><a class="teacher" href="teacher.html">👩‍🏫 進入老師端</a><div class="grid" id="grid"></div></main><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>const animals=['🦁','🐯','🐼','🦊','🐸'];const g=document.getElementById('grid');animals.forEach((a,i)=>{const u=new URL('student.html',location.href);u.searchParams.set('team',i+1);const c=document.createElement('div');c.className='card';c.innerHTML=`<div class="animal">${a}</div><div class="name">第 ${i+1} 組</div><div class="qr" id="q${i}"></div><a class="go" href="${u.href}">📱 直接進入</a>`;g.appendChild(c);new QRCode(document.getElementById('q'+i),{text:u.href,width:150,height:150})});</script></body></html>
