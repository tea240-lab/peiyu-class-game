<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>珮瑜的萬用課堂闖關｜學生端</title><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#6b7280;--line:#dbe2ea;--shadow:0 10px 30px rgba(23,32,51,.12)}
*{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Noto Sans TC","Microsoft JhengHei",sans-serif;background:linear-gradient(135deg,#f6f8ff,#fff7ef);color:var(--ink)}
button,select{font:inherit} button{cursor:pointer;border:0}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:12px;align-items:center;justify-content:space-between}
h1{font-size:clamp(24px,3vw,38px);margin:0}.sub{color:var(--muted);font-weight:700}
.tabs{display:flex;gap:8px}.tab{padding:12px 18px;border-radius:16px;background:#e9eef7;font-weight:900}.tab.active{background:#172033;color:#fff}
main{max-width:1250px;margin:auto;padding:18px}.panel{display:none}.panel.active{display:block}
.grid{display:grid;gap:14px}.scores{grid-template-columns:repeat(5,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px}
.team{text-align:center}.animal{font-size:46px}.teamname{font-size:20px;font-weight:900}.score{font-size:46px;font-weight:1000;margin:5px 0;color:#e11d48}
.diceResult{margin:8px auto 12px;padding:8px 10px;border-radius:14px;background:#eef7ff;font-size:30px;font-weight:1000;min-height:52px;display:flex;align-items:center;justify-content:center}
.diceResult.rolled{background:#dff3ff;animation:diceGlow .45s 3 alternate}
@keyframes diceGlow{to{transform:scale(1.06);box-shadow:0 0 18px rgba(59,130,246,.45)}}
.stepper{display:flex;justify-content:center;gap:10px}.pm{width:62px;height:52px;border-radius:16px;font-size:28px;font-weight:1000;background:#eef2f7}.pm.plus{background:#dff3ff}.pm.minus{background:#ffe5e5}
.toprow{display:grid;grid-template-columns:1.1fr 2fr;gap:14px;margin-bottom:14px}
.roundbox{display:flex;align-items:center;justify-content:center;gap:14px}.roundnum{font-size:42px;font-weight:1000}.roundbtn{width:54px;height:54px;border-radius:16px;font-size:28px;font-weight:1000}
.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.ctl,.gamebtn{min-height:74px;border-radius:20px;font-size:20px;font-weight:1000;padding:12px;background:#eef2f7}.ctl.on{outline:4px solid #6ee7b7;background:#e8fff4}
.activities{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:14px}.gamebtn{font-size:22px;background:#fff}
.gamebtn[data-type="random"]{background:#fff3c7}.gamebtn[data-type="bomb"]{background:#ffe0e0}.gamebtn[data-type="double"]{background:#ffe7c2}.gamebtn[data-type="steal"]{background:#eee4ff}
.status{margin-top:14px;text-align:center;font-size:24px;font-weight:1000;min-height:62px;display:flex;align-items:center;justify-content:center;border-radius:20px;background:#f1f5f9}
.studentHead{display:flex;justify-content:space-between;align-items:center;gap:12px}.studentHead select{font-size:22px;padding:12px;border-radius:14px;border:1px solid var(--line)}
.studentScore{text-align:center;font-size:26px;font-weight:900}.studentScore b{font-size:46px}
.bigactions{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:14px}.big{min-height:120px;border-radius:26px;font-size:30px;font-weight:1000;background:#fff;box-shadow:var(--shadow)}
.big:disabled,.scorechoice:disabled{opacity:.35;filter:grayscale(.4);cursor:not-allowed}
.big.buzz{background:#fff0c7}.big.dice{background:#dff3ff;border:4px solid #60a5fa;min-height:150px}
.big.dice:not(:disabled){animation:diceReady .7s infinite alternate;box-shadow:0 0 24px rgba(59,130,246,.55)}
@keyframes diceReady{to{transform:scale(1.025);background:#bfdbfe}}
.eventrow{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.event{min-height:90px;border-radius:22px;font-size:21px;font-weight:1000}
.scorearea{margin-top:14px}.scoretitle{text-align:center;font-size:24px;font-weight:1000;margin-bottom:10px}
.scoregrid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.scorechoice{height:70px;border-radius:18px;font-size:26px;font-weight:1000}.pos{background:#dcfce7}.neg{background:#fee2e2}
.overlay{position:fixed;inset:0;background:rgba(15,23,42,.75);z-index:99;display:none;align-items:center;justify-content:center;padding:20px}.overlay.show{display:flex}.popup{width:min(720px,95vw);background:#fff;border-radius:34px;padding:34px;text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.3);animation:pop .25s ease-out}.popup .emoji{font-size:80px}.popup h2{font-size:42px;margin:8px}.popup p{font-size:28px;font-weight:900;margin:8px}.close{margin-top:18px;padding:14px 28px;border-radius:16px;background:#172033;color:#fff;font-weight:900;font-size:20px}
@keyframes pop{from{transform:scale(.75);opacity:0}to{transform:scale(1);opacity:1}}
.flash{animation:flash .55s 3}@keyframes flash{50%{transform:scale(1.05);box-shadow:0 0 0 8px #fde68a}}
.neon-team{
  position:relative;
  z-index:5;
  animation:teamNeon .48s ease-in-out 6 alternate;
}
@keyframes teamNeon{
  from{
    transform:scale(1);
    border-color:#ffffff;
    box-shadow:0 0 8px #ffffff,0 0 16px #22d3ee,0 0 24px #a855f7;
  }
  to{
    transform:scale(1.07);
    border-color:#fef08a;
    box-shadow:0 0 14px #ffffff,0 0 28px #22d3ee,0 0 48px #a855f7,0 0 68px #f43f5e;
  }
}
.smallnote{text-align:center;color:var(--muted);font-weight:700;margin-top:12px}
@media(max-width:900px){.scores{grid-template-columns:repeat(2,1fr)}.toprow{grid-template-columns:1fr}.controls,.activities,.eventrow{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){main{padding:10px}.scores{grid-template-columns:1fr 1fr}.card{padding:12px;border-radius:20px}.score{font-size:38px}.bigactions{grid-template-columns:1fr}.big{min-height:100px}.scoregrid{grid-template-columns:repeat(3,1fr)}.eventrow{grid-template-columns:repeat(2,1fr)}}

.tabs{display:none}
.loginCard{max-width:420px;margin:12px auto 20px}.loginCard h2{margin-top:0}.loginCard label{display:block;margin:12px 0;font-weight:700}
.loginCard input{display:block;width:100%;padding:10px;margin-top:6px;border:1px solid #8898b2;border-radius:8px;font:inherit}
.authBtn{padding:10px 16px;border-radius:8px;background:#172033;color:white;font-weight:800}
#authBar{text-align:right;margin-bottom:14px}#authMessage{min-height:1.4em;margin-bottom:0}
</style></head><body><header><div><h1>👑 珮瑜的萬用課堂闖關</h1><div class="sub">📱 學生端｜Firebase 即時同步</div></div></header><main>
  <form id="loginForm" class="card loginCard">
    <h2 id="loginTitle">小組登入</h2>
    <label>登入帳號<input id="loginEmail" type="email" autocomplete="username" required></label>
    <label>遊戲密碼<input id="loginPassword" type="password" autocomplete="current-password" required></label>
    <button class="authBtn" id="loginButton" type="submit" disabled>登入</button>
    <p id="authMessage" role="status">正在載入登入功能…</p>
  </form>
  <div id="authBar" hidden><button id="logoutButton" class="authBtn" type="button">登出</button></div>
<section id="student" class="panel active">
  <div class="card studentHead">
    <div><div class="sub">學生 iPad</div><div id="teamPrompt" style="font-size:24px;font-weight:900">掃 QR Code 已指定組別</div></div>
    <div class="studentScore"><span id="studentAnimal"></span> 第 <span id="studentTeam">—</span> 組<br>目前 <b id="studentScore">0</b> 分</div>
  </div>
  <div class="bigactions">
    <button class="big buzz" id="buzzBtn" disabled>🔔 搶答鈴<br><span class="sub">等待老師開放</span></button>
    <button class="big dice" id="diceBtn" disabled>
  <span style="font-size:52px">🎲</span><br>
  <span style="font-size:32px">擲骰子</span><br>
  <span id="diceText" class="sub">🔒 等待老師開放</span>
</button>
  </div>
  <div class="eventrow">
    <button class="event" id="randomBtn" disabled>💎 隨機事件</button>
    <button class="event" id="bombBtn" disabled>💣 炸彈題</button>
    <button class="event" id="doubleBtn" disabled>🔥 加倍題</button>
    <button class="event" id="stealBtn" disabled>👑 偷分卡</button>
  </div>
  <div class="card scorearea">
    <div class="scoretitle">➕➖ 加扣分 <span id="scoreLock" class="sub">｜等待老師開放</span></div>
    <div class="scoregrid" id="plusGrid"></div>
    <div style="height:10px"></div>
    <div class="scoregrid" id="minusGrid"></div>
  </div>
  <div class="status" id="studentStatus" role="status">正在連線至老師端…</div>
</section></main>
<script>
const animals = ['🦁', '🐯', '🐼', '🦊', '🐸'];
const team = new URLSearchParams(location.search).get('team');
const selected = /^[1-5]$/.test(team) ? Number(team) - 1 : -1;
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const studentStatus = $('#studentStatus');
if (selected >= 0) {
  $('#studentAnimal').textContent = animals[selected];
  $('#studentTeam').textContent = selected + 1;
  $('#student').classList.remove('active');
  $('#loginTitle').textContent = '第 ' + team + ' 組登入';
  $('#loginEmail').value = 'team' + team + '@example.com';
} else {
  $('#loginForm').hidden = true;
  $('#teamPrompt').textContent = '尚未指定組別';
  studentStatus.innerHTML = '請掃描各組的 QR Code，或<a href="./">回首頁選擇組別</a>。';
}
</script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script><script>
function startStudentGame(root) {
let state = {};
let soundOn = true;
let rolling = false;
function beep(freq=660,dur=.12,type='sine'){if(!soundOn)return;const A=new (window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.type=type;o.frequency.value=freq;o.connect(g);g.connect(A.destination);g.gain.setValueAtTime(.26,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+dur);o.start();o.stop(A.currentTime+dur)}
function successSound(){beep(523,.14,'square');setTimeout(()=>beep(659,.14,'square'),130);setTimeout(()=>beep(784,.16,'square'),260);setTimeout(()=>beep(1047,.48,'square'),410)}
function norm(v={}){v.scores=v.scores||[0,0,0,0,0];v.diceResults=v.diceResults||[null,null,null,null,null];v.open=Object.assign({buzz:false,dice:false,score:false,random:false,bomb:false,double:false,steal:false},v.open||{});v.used=v.used||{};v.used.dice=v.used.dice||[false,false,false,false,false];v.used.score=v.used.score||[false,false,false,false,false];return v}
function render(){state=norm(state);$('#studentScore').textContent=state.scores[selected]||0;$('#buzzBtn').disabled=!state.open.buzz||state.buzzerWinner!=null;$('#buzzBtn').innerHTML=state.open.buzz&&state.buzzerWinner==null?'🔔 搶答鈴<br><span class="sub">現在可以搶！</span>':'🔔 搶答鈴<br><span class="sub">'+(state.buzzerWinner!=null?'本輪已有人搶到':'等待老師開放')+'</span>';$('#diceBtn').disabled=rolling||!state.open.dice||state.diceResults[selected]!=null;$('#diceText').textContent=!state.open.dice?'🔒 等待老師開放':state.diceResults[selected]!=null?`本輪已擲：${state.diceResults[selected]??''}`:'✨ 現在可以擲！';$('#scoreLock').textContent=state.open.score&&!state.used.score[selected]?'｜現在可以選一次':'｜'+(state.used.score[selected]?'本輪已使用':'等待老師開放');$$('.scorechoice').forEach(b=>b.disabled=!state.open.score||state.used.score[selected]);['random','bomb','double','steal'].forEach(t=>$('#'+t+'Btn').disabled=!state.open[t])}
root.on('value',s=>{state=norm(s.val()||{});render();if(state.buzzerWinner===selected)$('#studentStatus').textContent='🎉 搶到了！請回答老師的問題';else if(state.buzzerWinner!=null)studentStatus.textContent='🔒 本輪已由其他組搶到';else if(studentStatus.textContent==='正在連線至老師端…')studentStatus.textContent='🔒 等待老師開放'}, () => {
  studentStatus.textContent = '無法讀取老師端資料，請通知老師。';
});
async function sendAction(action) {
  try {
    await action();
  } catch (error) {
    studentStatus.textContent = '操作未送出，請等老師開放後再試。';
    console.error(error);
  }
}
$('#buzzBtn').onclick = () => sendAction(async () => {
  if (!state.open.buzz || state.buzzerWinner != null) return;
  const result = await root.child('buzzerWinner').transaction(winner => winner == null ? selected : undefined, undefined, false);
  if (result.committed) successSound();
});
$('#diceBtn').onclick = () => sendAction(async () => {
  if (rolling || !state.open.dice || state.diceResults[selected] != null) return;
  const round = state.round;
  rolling = true;
  $('#diceBtn').disabled = true;
  let points;
  try {
    for (let frame = 0; frame < 10; frame++) {
      points = 1 + Math.floor(Math.random() * 6);
      $('#diceText').textContent = '🎲 ' + points;
      beep(260 + points * 45, .04);
      await new Promise(resolve => setTimeout(resolve, 80));
    }
    if (state.round !== round || !state.open.dice) return;
    const result = await root.child('diceResults/' + selected).transaction(previous => previous == null ? points : undefined, undefined, false);
    if (result.committed) {
      studentStatus.textContent = '🎲 第 ' + team + ' 組擲到 ' + points + ' 點！';
      successSound();
    }
  } finally {
    rolling = false;
    render();
  }
});
function studentScore(points) {
  if (!Number.isInteger(points) || points === 0 || Math.abs(points) > 6 || !state.open.score || state.used.score[selected]) return;
  return sendAction(async () => {
    const applied = state.doubleMode ? points * 2 : points;
    await root.update({
      ['used/score/' + selected]: true,
      ['scores/' + selected]: firebase.database.ServerValue.increment(applied)
    });
    studentStatus.textContent = `已送出 ${applied > 0 ? '+' : ''}${applied} 分，等待下一次開放`;
    beep(applied > 0 ? 760 : 240, .12);
  });
}
window.studentScore=studentScore;$('#plusGrid').innerHTML=[1,2,3,4,5,6].map(n=>`<button class="scorechoice pos" onclick="studentScore(${n})">+${n}</button>`).join('');$('#minusGrid').innerHTML=[1,2,3,4,5,6].map(n=>`<button class="scorechoice neg" onclick="studentScore(${-n})">-${n}</button>`).join('');
$('#randomBtn').onclick=()=>$('#studentStatus').textContent='💎 隨機事件已開放，請依老師指示';$('#bombBtn').onclick=()=>$('#studentStatus').textContent='💣 炸彈題進行中！';$('#doubleBtn').onclick=()=>$('#studentStatus').textContent='🔥 加倍題進行中！';$('#stealBtn').onclick=()=>$('#studentStatus').textContent='👑 偷分卡已開放，請依老師指示';
}

async function connectLogin(appName, expectedUid, startGame) {
  const form = document.getElementById('loginForm');
  const button = document.getElementById('loginButton');
  const message = document.getElementById('authMessage');
  const password = document.getElementById('loginPassword');
  const panel = document.getElementById('student');
  const bar = document.getElementById('authBar');
  const logout = document.getElementById('logoutButton');
  try {
    const app = firebase.initializeApp(firebaseConfig, appName);
    const auth = app.auth();
    await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
    let started = false;
    let wrongAccount = false;
    form.onsubmit = async event => {
      event.preventDefault();
      button.disabled = true;
      wrongAccount = false;
      message.textContent = '登入中…';
      try {
        await auth.signInWithEmailAndPassword(document.getElementById('loginEmail').value.trim(), password.value);
      } catch (error) {
        message.textContent = error.code === 'auth/network-request-failed'
          ? '連線失敗，請檢查網路後再試。'
          : '登入失敗，請確認遊戲帳號和密碼。';
        button.disabled = false;
      } finally {
        password.value = '';
      }
    };
    logout.onclick = async () => {
      logout.disabled = true;
      try {
        await auth.signOut();
      } catch (error) {
        logout.disabled = false;
        document.getElementById('studentStatus').textContent = '登出失敗，請再試一次。';
      }
    };
    auth.onAuthStateChanged(async user => {
      if (!user) {
        if (started) {
          panel.classList.remove('active');
          location.reload();
          return;
        }
        message.textContent = wrongAccount ? '這個帳號無法進入此頁，請使用對應帳號。' : '';
        button.disabled = false;
        return;
      }
      if (user.uid !== expectedUid) {
        wrongAccount = true;
        try {
          await auth.signOut();
        } catch (error) {
          message.textContent = '此帳號無法使用本頁。請關閉分頁，再以對應帳號開啟。';
        }
        return;
      }
      if (started) return;
      started = true;
      form.hidden = true;
      bar.hidden = false;
      panel.classList.add('active');
      startGame(app.database().ref('rooms/main'));
    }, () => {
      message.textContent = '登入服務無法使用，請重新整理。';
    });
  } catch (error) {
    message.textContent = '無法載入登入服務，請檢查網路後重新整理。';
    console.error(error);
  }
}
const teamUids = ["D1Dp7JE4skOl7mVwplQrQUoKJ0J2", "zS0bXJ76h5ZRurEMWyVYW9GLCx43", "Vmg13QR0KGh4S9xSPMSTEPnK1sn2", "jPcPK2v9YEWoMRCZZGMRLabLq8J2", "s8698bAgdJQXFqC0ehHmSFiAYiC2"];
if (selected >= 0) connectLogin('classroom-student-' + team, teamUids[selected], startStudentGame);
</script></body></html>
